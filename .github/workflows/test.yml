name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-c:
    name: C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
        working-directory: C

  test-js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make test
        working-directory: JavaScript

  test-asm:
    name: Assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: make test
        working-directory: ASM
